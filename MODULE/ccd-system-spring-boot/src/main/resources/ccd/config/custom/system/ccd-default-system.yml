####################################################
############ 以下 ccd custom starter ################
####################################################
# 1.if want override default custom starter 解開需要的複寫
# 2.輸入關鍵字. 後按下 alt + / 則會跳出相關可設定的自動完成項目
# 3.若點擊其上一步自動完成項目，會跳到其 XXXXproperties.java 
# 已知前墜 ccd.system

ccd:
  system:
    #id: client project 應該複寫
    #dir:  client project 應該複寫，由於 spring boot yml 無法用語法將變數自動轉大寫所以需要額外設定大寫目錄變數)
    basedir: ${BASEDIR:../CONFIG}
    path:
      config: ${ccd.system.basedir}/${ccd.system.dir}/config # option
      data: ${ccd.system.basedir}/${ccd.system.dir}/data # 永久存放
      temp: ${ccd.system.basedir}/${ccd.system.dir}/tmp # 暫存、需有對應清除機制
      log: ${ccd.system.basedir}/${ccd.system.dir}/log

