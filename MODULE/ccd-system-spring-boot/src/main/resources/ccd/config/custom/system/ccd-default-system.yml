# 1.if want override default 解開需要的複寫或是透過第2、3步驟找到其預設
# 2.按下 alt + / 或輸入關鍵字後按下 alt + / 則會跳出相關可設定的自動完成項目
# 3.若點擊其上一步自動完成項目，會跳到其 XXXXproperties.java 
